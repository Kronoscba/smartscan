[project]
name = "smartscan"
version = "0.1.0"
description = "Escáner de puertos inteligente con CVE, Shodan y DNS"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "aiodns>=3.1.1",
    "shodan>=1.30.0",
    "greynoise>=2.0.0",
    "dnspython>=2.8.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
smartscan = "smartscan.cli:cli"
smartscan-web = "smartscan.api:serve"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
